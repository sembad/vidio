<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Delete Device</title>
    <link rel="shortcut icon" type="image/png" href="./1.0.0-52/images/operator_favicon.png" />
    <script src="../../common/vendor/1.0.0-52/javascripts/jquery.min.js"></script>
    <script src="../../common/vendor/1.0.0-52/javascripts/tether.min.js"></script>
    <script src="../../common/vendor/1.0.0-52/javascripts/bootstrap.min.js"></script>
    <script src="./1.0.0-52/javascripts/oauth-ui-config.js"></script>
    <script src="../../common/device-management/1.0.0-52/javascripts/default_eng_strings.js"></script>
    <script src="../../common/device-management/1.0.0-52/javascripts/general_config.js"></script>
    <script src="../../common/device-management/1.0.0-52/javascripts/general_functions.js"></script>
    <script src="../../common/device-management/1.0.0-52/javascripts/handler.js"></script>
    <script src="./1.0.0-52/javascripts/default_eng_strings.js"></script>
    <link rel="stylesheet" href="../../common/vendor/1.0.0-52/stylesheets/bootstrap.min.css" />
    <link rel="stylesheet" href="../../common/device-management/1.0.0-52/stylesheets/spinner.css" />
    <link rel="stylesheet" href="../../common/device-management/1.0.0-52/stylesheets/style.css" />
    <link rel="stylesheet" href="./1.0.0-52/stylesheets/style.css" />
</head>

<body>
    <div class="container">

        <div id="logo" class="row align-items-center justify-content-center text-center my-5">
            <div class="col-4 col-md-2">
                <img src="./1.0.0-52/images/operator_logo.png" class="img-fluid" alt="operator logo">
            </div>
        </div>

        <div id="heading" class="row align-items-center justify-content-center">
            <div class="col text-center"> Registered Devices </div>
        </div>

        <div id="instruction" class="row align-items-center justify-content-center mt-2">
            <div class="col text-center text"> You have exceeded the maximum allocated devices.<br>Please remove devices
                to continue registering this device.
            </div>
        </div>

        <div class="row align-items-center justify-content-center mt-5">
            <div id="main-container" class="col-lg-7 col-md-9 col m-1">
                <div id="spinner-container" hidden>
                    <div id="spinner"></div>
                    <div class="text-center spinner-text"></div>
                </div>
                <div id="device-list-error" class="mx-auto alert alert-danger container" hidden>
                    <div class="row text-center">
                        <div class="col error-text"></div>
                    </div>
                </div>
                <div id="devices-container">
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col text-center">
                <button id="deletion-completed" type="button" class="btn general-btn py-2half px-4" disabled>
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <div class="action-complete-indication container-fluid w-100 fixed-bottom p-3">
    </div>

    <div class="modal" id="deleteDeviceModal" tabindex="-1" role="dialog" aria-labelledby="deleteDeviceModalLabel"
        aria-hidden="true" data-backdrop="false">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteDeviceModalLabel">Confirmation</h5>
                </div>
                <div class="modal-body">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary confirm">Remove</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
