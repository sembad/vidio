<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSL Error</title>
  <style>
    body {
        text-align: center;
        padding: 20px;
        color: white; /* White text */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .warning {
        color: #ff9800;
        font-size: 48px;
    }
    h1 {
        color: white;
        font-size: 100%; /* Reduced to 70% (30% smaller) */
    }
    p {
        color: white;
    }
  </style>
  <script>

    function updateErrorTitle(errorTitle) {
        document.getElementById("errorTitle").innerText =  errorTitle;
    }
      function updateErrorMessage(errorMessage) {
        document.getElementById("errorMessage").innerText =  errorMessage;
    }
      function updateErrorCode(errorCode) {
        document.getElementById("errorCode").innerText = errorCode;
    }
  </script>
</head>
<body>
<div class="container">
  <div class="warning">⚠️</div>
  <h1 id="errorTitle">Warning</h1>
  <p id="errorMessage">The certificate has expired or is invalid.</p>
  <p id="errorCode">Error: The certificate has expired or is invalid.</p>
</div>
</body>
</html>
